[project]
name = "mahan-otp-relay-v2"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "pydantic-settings>=2.4,<3",
  "sqlalchemy[asyncio]>=2.0,<3", "aiosqlite>=0.20,<1",
  "asyncpg>=0.29,<1", "alembic>=1.13,<2", "cryptography>=43,<46",
  "structlog>=24,<26", "uvicorn>=0.30,<1", "httpx>=0.27,<1"
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.6,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
