# /etc/nginx/sites-available/otp.mahanvip.ir
# Configuration for MAHANBOT & OTP Relay Server on otp.mahanvip.ir

server {
    listen 80;
    server_name otp.mahanvip.ir;

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name otp.mahanvip.ir;

    # SSL Certificates (managed via Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/otp.mahanvip.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/otp.mahanvip.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 100M;

    # Direct Downloads (APK files, MahanBot release zip, updates)
    location /downloads/ {
        alias /var/www/mahanbot/downloads/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;

        # Enable resume and range downloads for APK and ZIP
        add_header Accept-Ranges bytes;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "public, max-age=3600";
    }

    # Mahan OTP Server Relay & API Endpoints (FastAPI on Port 8010)
    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Optional: MahanBot Web Dashboard (if hosted on the same domain on port 8000)
    location /bot/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
