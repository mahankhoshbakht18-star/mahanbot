<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8">
<title>Isolated WebForms OTP fixture</title>
<form method="post" action="/continue">

  <input id="CHALLENGE_FIELD" name="sms_code" autocomplete="one-time-code" maxlength="6">

</form>

<div role="alert">SERVER_ERROR</div>
</html>
