<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .stat-card { border: none; border-radius: 15px; color: white; transition: transform 0.3s; overflow: hidden; position: relative; }
        .stat-card:hover { transform: translateY(-5px); }
        .stat-card .icon-bg { position: absolute; left: 10px; bottom: 10px; font-size: 4rem; opacity: 0.2; }
        .bg-gradient-blue { background: linear-gradient(45deg, #4facfe 0%, #00f2fe 100%); }
        .bg-gradient-green { background: linear-gradient(45deg, #43e97b 0%, #38f9d7 100%); }
        .bg-gradient-orange { background: linear-gradient(45deg, #fa709a 0%, #fee140 100%); }
        .bg-gradient-dark { background: linear-gradient(45deg, #30cfd0 0%, #330867 100%); }
        
        .terminal-window { background-color: #1e1e1e; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); border: 1px solid #333; }
        .terminal-header { background-color: #2d2d2d; padding: 10px 15px; border-top-left-radius: 10px; border-top-right-radius: 10px; display: flex; align-items: center; }
        .terminal-dots { display: flex; gap: 6px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; }
        .dot-red { background: #ff5f56; }
        .dot-yellow { background: #ffbd2e; }
        .dot-green { background: #27c93f; }
    </style>
</head>
<body>

    <nav class="sidebar">
        <div class="sidebar-header">
            <i class="fas fa-space-shuttle text-warning fa-2x mb-2"></i>
            <h4>CBI TURBO <span class="badge bg-white text-dark shadow-sm" style="font-size: 0.6em;">ULTIMATE</span></h4>
        </div>
        <ul class="nav flex-column mt-3 w-100 px-2" style="overflow-y: auto; max-height: 80vh;">
            <li class="nav-divider text-muted small my-2 pe-3" data-i18n="nav.management"></li>
            <li class="nav-item" onclick="switchView('dashboard', this)"><a class="nav-link active"><i class="fas fa-tachometer-alt"></i> <span data-i18n="nav.dashboard"></span></a></li>
            <li class="nav-item" onclick="switchView('add', this)"><a class="nav-link"><i class="fas fa-user-plus"></i> <span data-i18n="nav.addApplicant"></span></a></li>
            <li class="nav-item" onclick="switchView('list', this)"><a class="nav-link"><i class="fas fa-list-ol"></i> <span data-i18n="nav.applicantsList"></span></a></li>
            <li class="nav-divider text-muted small my-2 pe-3" data-i18n="nav.bankOperations"></li>
            <li class="nav-item" onclick="switchView('list', this)"><a class="nav-link"><i class="fas fa-user-check"></i> <span data-i18n="nav.initialRegistration"></span></a></li>
            <li class="nav-item" onclick="switchView('bank-select', this)"><a class="nav-link"><i class="fas fa-university"></i> <span data-i18n="nav.bankSelection"></span></a></li>
            <li class="nav-item" onclick="switchView('delete-req', this)"><a class="nav-link text-danger"><i class="fas fa-user-times"></i> <span data-i18n="nav.deleteRequest"></span></a></li>
            <li class="nav-item" onclick="switchView('status', this)"><a class="nav-link"><i class="fas fa-search-location"></i> <span data-i18n="nav.statusView"></span></a></li>
            <li class="nav-item" onclick="switchView('recover', this)"><a class="nav-link text-warning"><i class="fas fa-barcode"></i> <span data-i18n="nav.recoverTracking"></span></a></li>
            <li class="nav-divider text-muted small my-2 pe-3" data-i18n="nav.system"></li>
            <li class="nav-item" onclick="switchView('settings', this)"><a class="nav-link"><i class="fas fa-cogs"></i> <span data-i18n="nav.settings"></span></a></li>
        </ul>
        <div class="server-status text-center mt-auto mb-3 pt-2 border-top border-secondary">
            <span id="connectionStatus" class="badge bg-secondary" data-i18n="connection.connecting"></span>
        </div>
    </nav>

    <main class="main-content">
        <div id="view-dashboard" class="view-section active-view">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold m-0" data-i18n="dashboard.title"></h2>
                    <small class="text-muted" data-i18n="dashboard.subtitle"></small>
                </div>
                <div class="d-flex gap-3 align-items-center">
                    <div class="bg-white px-3 py-2 rounded shadow-sm fw-bold font-monospace" id="clock">00:00:00</div>
                    <button class="btn btn-primary shadow-sm" onclick="fetchDashboardData()"><i class="fas fa-sync-alt me-2"></i><span data-i18n="dashboard.refresh"></span></button>
                </div>
            </div>
            <div class="row g-3 mb-4">
                <div class="col-md-3"><div class="card stat-card bg-gradient-blue p-3 h-100"><div class="icon-bg"><i class="fas fa-users"></i></div><h3 data-i18n="dashboard.totalApplicants"></h3><h1 class="fw-bold m-0" id="stat-total">0</h1></div></div>
                <div class="col-md-3"><div class="card stat-card bg-gradient-orange p-3 h-100"><div class="icon-bg"><i class="fas fa-robot"></i></div><h3 data-i18n="dashboard.activeBots"></h3><h1 class="fw-bold m-0" id="stat-active">0</h1></div></div>
                <div class="col-md-3"><div class="card stat-card bg-gradient-green p-3 h-100"><div class="icon-bg"><i class="fas fa-check-circle"></i></div><h3 data-i18n="dashboard.finalRegistrations"></h3><h1 class="fw-bold m-0" id="stat-success">0</h1></div></div>
                <div class="col-md-3"><div class="card stat-card bg-gradient-dark p-3 h-100"><div class="icon-bg"><i class="fas fa-barcode"></i></div><h3 data-i18n="dashboard.trackingCodes"></h3><h1 class="fw-bold m-0" id="stat-codes">0</h1></div></div>
            </div>
            <div class="row g-4">
                <div class="col-lg-5">
                    <div class="card border-0 shadow-sm mb-3">
                        <div class="card-body p-4 text-center bg-light rounded">
                            <h5 class="mb-3 fw-bold text-primary"><i class="fas fa-sms me-2"></i><span data-i18n="dashboard.otpTitle"></span></h5>
                            <input type="text" id="otpInput" class="form-control otp-input mx-auto mb-2" maxlength="6" data-i18n-placeholder="placeholders.otp" autocomplete="off">
                            <div id="otpStatus" class="fw-bold" style="min-height: 25px;"></div>
                        </div>
                    </div>
                    <div class="card border-0 shadow-sm">
                        <div class="card-header bg-white py-3 border-bottom"><h6 class="m-0 fw-bold"><i class="fas fa-pulse text-danger me-2"></i><span data-i18n="dashboard.liveOperations"></span></h6></div>
                        <div class="table-responsive"><table class="table table-hover align-middle mb-0 text-center small"><thead class="bg-light"><tr><th data-i18n="lists.statusName"></th><th data-i18n="lists.listStatus"></th><th data-i18n="lists.statusAction"></th></tr></thead><tbody id="activeBotsBody"></tbody></table></div>
                    </div>
                </div>
                <div class="col-lg-7">
                    <div class="terminal-window h-100 d-flex flex-column">
                        <div class="terminal-header"><div class="terminal-dots"><div class="dot dot-red"></div><div class="dot dot-yellow"></div><div class="dot dot-green"></div></div><div class="text-white ms-3 small font-monospace opacity-75" data-i18n="log.terminalTitle"></div></div>
                        <div class="bg-dark text-white px-3 py-2 d-flex flex-wrap gap-2 align-items-center">
                            <input type="text" id="logFilterText" class="form-control form-control-sm w-auto" data-i18n-placeholder="log.searchPlaceholder">
                            <input type="text" id="logFilterNid" class="form-control form-control-sm w-auto" data-i18n-placeholder="log.nidPlaceholder">
                            <input type="text" id="logFilterJob" class="form-control form-control-sm w-auto" data-i18n-placeholder="log.jobPlaceholder">
                            <select id="logFilterType" class="form-select form-select-sm w-auto">
                                <option value="" data-i18n="log.allEvents"></option>
                                <option value="log" data-i18n="log.log"></option>
                                <option value="job_status" data-i18n="log.status"></option>
                                <option value="metric" data-i18n="log.metric"></option>
                            </select>
                            <select id="logFilterLevel" class="form-select form-select-sm w-auto">
                                <option value="" data-i18n="log.allLevels"></option>
                                <option value="info" data-i18n="log.levelInfo"></option>
                                <option value="success" data-i18n="log.levelSuccess"></option>
                                <option value="warning" data-i18n="log.levelWarning"></option>
                                <option value="error" data-i18n="log.levelError"></option>
                                <option value="stopped" data-i18n="log.levelStopped"></option>
                                <option value="stopping" data-i18n="log.levelStopping"></option>
                                <option value="registering" data-i18n="log.levelRegistering"></option>
                                <option value="selecting" data-i18n="log.levelSelecting"></option>
                                <option value="waiting sms" data-i18n="log.levelWaitingSms"></option>
                            </select>
                            <button class="btn btn-sm btn-outline-light" id="logClearBtn" data-i18n="log.clear"></button>
                        </div>
                        <div class="card-body overflow-auto p-3" id="terminalBox" style="height: 350px; font-family: 'Consolas', monospace; color: #4af626; font-size: 0.9rem;">
                            <div>&gt; <span data-i18n="log.initialLineOne"></span></div>
                            <div>&gt; <span data-i18n="log.initialLineTwo"></span></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="view-add" class="view-section">
            <div class="d-flex justify-content-between align-items-center mb-4"><h2 class="fw-bold" id="formTitle" data-i18n="addForm.titleNew"></h2><button class="btn btn-outline-danger btn-sm" onclick="resetAddForm()" id="btnResetForm" style="display:none;"><i class="fas fa-times me-1"></i><span data-i18n="addForm.cancelEdit"></span></button></div>
            <div class="card border-0 shadow-sm p-4">
                <form id="addForm">
                    <div class="row g-4">
                        <div class="col-md-12">
                            <h5 class="text-primary fw-bold border-bottom pb-2 mb-3"><i class="fas fa-id-card me-2"></i><span data-i18n="addForm.sectionIdentity"></span></h5>
                            <div class="row g-3">
                                <div class="col-md-3"><label class="form-label small text-muted" data-i18n="addForm.fullName"></label><input type="text" class="form-control" id="inpName"></div>
                                <div class="col-md-3"><label class="form-label small text-muted" data-i18n="addForm.nationalId"></label><input type="text" class="form-control fw-bold bg-light" id="inpNid" maxlength="10"></div>
                                <div class="col-md-3"><label class="form-label small text-muted" data-i18n="addForm.mobile"></label><input type="text" class="form-control fw-bold" id="inpMobile" maxlength="11"></div>
                                <div class="col-md-3"><label class="form-label small text-muted" data-i18n="addForm.spouseId"></label><input type="text" class="form-control" id="inpSpouse" maxlength="10"></div>
                                <div class="col-md-3"><label class="form-label small text-muted" data-i18n="addForm.phone"></label><input type="text" class="form-control" id="inpPhone" placeholder="021..."></div>
                                <div class="col-md-3"><label class="form-label small text-muted" data-i18n="addForm.zipCode"></label><input type="text" class="form-control" id="inpZip" maxlength="10"></div>
                                <div class="col-md-3">
                                    <label class="form-label small text-muted" data-i18n="addForm.state"></label>
                                    <select class="form-select" id="inpState"></select>
                                </div>
                                <div class="col-md-3"><label class="form-label small text-muted" data-i18n="addForm.city"></label><input type="text" class="form-control" id="inpCity"></div>
                                <div class="col-md-3">
                                    <label class="form-label small text-muted" data-i18n="addForm.militaryStatus"></label>
                                    <select class="form-select" id="inpMilitary"></select>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6"><h5 class="text-primary fw-bold border-bottom pb-2 mb-3" data-i18n="addForm.birthDate"></h5><div class="input-group"><input type="number" class="form-control text-center" id="bd_d" data-i18n-placeholder="placeholders.day"><input type="number" class="form-control text-center" id="bd_m" data-i18n-placeholder="placeholders.month"><input type="number" class="form-control text-center" id="bd_y" data-i18n-placeholder="placeholders.year"></div></div>
                        <div class="col-md-6"><h5 class="text-primary fw-bold border-bottom pb-2 mb-3" data-i18n="addForm.marriageDate"></h5><div class="input-group"><input type="number" class="form-control text-center" id="md_d" data-i18n-placeholder="placeholders.day"><input type="number" class="form-control text-center" id="md_m" data-i18n-placeholder="placeholders.month"><input type="number" class="form-control text-center" id="md_y" data-i18n-placeholder="placeholders.year"></div></div>
                        <div class="col-md-12"><h5 class="text-primary fw-bold border-bottom pb-2 mb-3" data-i18n="addForm.bankPriority"></h5><div class="row g-3"><div class="col-md-5"><div class="input-group mb-2"><select class="form-select" id="inpBankName"></select><input type="text" class="form-control" id="inpBranch" data-i18n-placeholder="placeholders.branchCode"><button class="btn btn-success" type="button" onclick="addBankPriority()"><i class="fas fa-plus"></i></button></div></div><div class="col-md-7"><div id="priorityList" class="bg-light rounded p-2 border d-flex flex-wrap gap-2" style="min-height: 50px;"></div></div></div></div>
                        <div class="col-md-12 mt-3"><div class="bg-success bg-opacity-10 border border-success rounded p-3 d-flex justify-content-between align-items-center"><div><h6 class="fw-bold text-success m-0" data-i18n="addForm.trackingCode"></h6></div><input type="text" class="form-control border-success text-center fw-bold fs-5" id="inpTrackingCode" style="max-width: 250px;" placeholder="---"></div></div>
                    </div>
                    <div class="mt-4 pt-3 border-top text-end"><button type="button" class="btn btn-secondary px-4 me-2" onclick="resetAddForm()" data-i18n="addForm.reset"></button><button type="button" class="btn btn-primary btn-lg px-5 shadow fw-bold" onclick="submitNewApplicant()" data-i18n="addForm.save"></button></div>
                </form>
            </div>
        </div>

        <div id="view-list" class="view-section"><h2 class="fw-bold mb-4" data-i18n="lists.applicantsTitle"></h2><div class="card border-0 shadow-sm"><div class="table-responsive"><table class="table table-hover align-middle mb-0 text-center"><thead class="bg-light"><tr><th data-i18n="lists.listIndex"></th><th data-i18n="lists.listNameEdit"></th><th data-i18n="lists.listNationalId"></th><th data-i18n="lists.listTrackingCode"></th><th data-i18n="lists.listStatus"></th><th data-i18n="lists.listQuickStart"></th></tr></thead><tbody id="applicantsListBody"></tbody></table></div></div></div>

        <div id="view-bank-select" class="view-section"><h2 class="fw-bold mb-4 text-primary" data-i18n="lists.bankSelectTitle"></h2><div class="card border-0 shadow-sm"><table class="table table-hover text-center"><tbody id="bankSelectListBody"></tbody></table></div></div>
        <div id="view-status" class="view-section"><h2 class="fw-bold mb-4 text-info" data-i18n="lists.statusTitle"></h2><div class="card border-0 shadow-sm"><table class="table table-hover text-center"><thead class="bg-light"><tr><th data-i18n="lists.statusName"></th><th data-i18n="lists.statusNationalId"></th><th data-i18n="lists.statusTracking"></th><th data-i18n="lists.statusAction"></th></tr></thead><tbody id="statusListBody"></tbody></table></div></div>
        <div id="view-recover" class="view-section"><h2 class="fw-bold mb-4 text-warning" data-i18n="lists.recoverTitle"></h2><div class="card border-0 shadow-sm"><table class="table table-hover text-center"><tbody id="recoverListBody"></tbody></table></div></div>
        <div id="view-delete-req" class="view-section"><h2 class="fw-bold mb-4 text-danger" data-i18n="lists.deleteTitle"></h2><div class="card border-0 shadow-sm"><table class="table table-hover text-center"><tbody id="deleteReqListBody"></tbody></table></div></div>

        <div id="view-settings" class="view-section">
            <div class="d-flex justify-content-between mb-4"><h2 class="fw-bold" data-i18n="settings.title"></h2><button class="btn btn-primary px-4" onclick="saveSettings()" data-i18n="settings.saveChanges"></button></div>
            <div class="row g-4">
                <div class="col-md-6">
                    <div class="card p-4 h-100 border-0 shadow-sm">
                        <h5 class="border-bottom pb-2 mb-3 text-primary" data-i18n="settings.botSettings"></h5>
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold" data-i18n="settings.captchaMode"></label>
                            <select class="form-select" id="set_captcha_mode">
                                <option value="human" data-i18n="settings.captchaHuman"></option>
                                <option value="robot" data-i18n="settings.captchaRobot"></option>
                            </select>
                            <small class="text-muted" data-i18n="settings.captchaHint"></small>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" data-i18n="settings.retryCount"></label>
                            <input type="number" class="form-control" id="set_retry" value="1000">
                        </div>

                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" type="checkbox" id="set_headless">
                            <label class="form-check-label" data-i18n="settings.headless"></label>
                        </div>
                        
                        <div class="alert alert-warning d-flex align-items-center mt-4">
                            <input class="form-check-input me-3 fs-4" type="checkbox" id="set_final_submit">
                            <div>
                                <label class="form-check-label fw-bold text-danger mb-0" for="set_final_submit" data-i18n="settings.finalSubmitTitle"></label>
                                <div style="font-size: 0.8rem;" data-i18n="settings.finalSubmitHint"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="card p-4 h-100 border-0 shadow-sm">
                        <h5 class="border-bottom pb-2 mb-3 text-primary" data-i18n="settings.networkSettings"></h5>
                        <div class="mb-3"><label data-i18n="settings.captchaDelay"></label><input type="number" class="form-control" id="set_captcha" step="0.1" value="0.1"></div>
                        <div class="form-check form-switch mb-3"><input class="form-check-input" type="checkbox" id="set_useproxy"><label class="form-check-label" data-i18n="settings.useProxy"></label></div>
                        <textarea class="form-control" id="set_proxylist" rows="6" data-i18n-placeholder="settings.proxyPlaceholder"></textarea>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div class="modal fade" id="bankActionModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><div class="modal-header bg-primary text-white"><h5 class="modal-title" data-i18n="modal.bankBotTitle"></h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><div class="modal-body text-center p-4"><p><span data-i18n="modal.loanTypePrompt"></span> <strong id="modalNidDisplay" class="text-primary"></strong>:</p><div class="btn-group w-100"><input type="radio" class="btn-check" name="loanType" id="type1" value="rbtnNaghdi" checked><label class="btn btn-outline-primary p-3" for="type1" data-i18n="modal.loanCash"></label><input type="radio" class="btn-check" name="loanType" id="type2" value="rbtnKala"><label class="btn btn-outline-primary p-3" for="type2" data-i18n="modal.loanGoods"></label></div></div><div class="modal-footer justify-content-center bg-light"><button type="button" class="btn btn-success px-5" onclick="confirmBankStart()" data-i18n="modal.start"></button></div></div></div></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/messages.fa.js"></script>
    <script src="/static/script.js"></script>
</body>
</html>
