<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Healthcheck</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        background: #f5f7fb;
        color: #2b2f33;
      }
      .card {
        background: #fff;
        border-radius: 16px;

        padding: 32px 40px;
        text-align: center;
      }
      h1 {
        font-size: 1.4rem;
        margin-bottom: 8px;
      }
      p {
        margin: 0;
        color: #5f6b7a;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>مرورگر با موفقیت راه‌اندازی شد</h1>
      <p>این صفحه داخلی برای نمایش وضعیت اجرا بارگذاری شده است.</p>
    </div>
  </body>
</html>
