name: MAHANBOT CI & Quality Assurance

on:
  push:
    branches: [ main, master, "release/**" ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Test Suite (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8

      - name: Code style & syntax check
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,venv,build,dist

      - name: Install Playwright browsers (fixture tests)
        run: |
          python -m playwright install chromium

      - name: Create Clean DB Template
        run: |
          python scripts/create_clean_distribution_db.py

      - name: Run Test Suite
        env:
          MAHANBOT_ENV: testing
          MAHANBOT_PORT: 8000
        run: |
          python scripts/run_tests.py
