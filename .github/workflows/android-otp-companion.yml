name: Android OTP Companion
on: [push, pull_request]
jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android/mahanbot-otp-companion } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17", cache: gradle }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - run: gradle testConsentDebugUnitTest testPrivateDebugUnitTest assembleConsentDebug assemblePrivateDebug
      - run: sha256sum app/build/outputs/apk/*/debug/*.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with: { name: MahanBot-OTP-Companion-1.0.0-apks, path: "android/mahanbot-otp-companion/app/build/outputs/apk/*/debug/*.apk" }
