name: OTP Relay v2
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e './services/mahan-otp-relay-v2[test]'
      - run: ruff check services/mahan-otp-relay-v2
      - run: pytest -q services/mahan-otp-relay-v2/tests
      - run: python -m compileall -q services/mahan-otp-relay-v2/app
