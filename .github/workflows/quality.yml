name: Quality checks

on:
  pull_request:
  push:
    branches:
      - main
      - "refactor/**"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply phase 1-4 migration in validation workspace
        if: ${{ hashFiles('scripts/apply_phase1_4_refactor.py') != '' }}
        shell: bash
        run: |
          set +e
          python scripts/apply_phase1_4_refactor.py > migration.log 2>&1
          status=$?
          cat migration.log
          exit $status

      - name: Install lightweight validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi

      - name: Run quality gate
        run: python scripts/quality_check.py

      - name: Build clean source archive
        shell: bash
        run: |
          mkdir -p dist
          zip -r dist/mahanbot-complete-source.zip . \
            -x ".git/*" \
               "dist/*" \
               "*.db" \
               "*.db-wal" \
               "*.db-shm" \
               ".env" \
               ".env.*" \
               "migration.log" \
               "chrome_profiles/*" \
               "screenshots/*" \
               "__pycache__/*" \
               "*/__pycache__/*"

      - name: Upload clean source archive
        uses: actions/upload-artifact@v4
        with:
          name: mahanbot-complete-source
          path: dist/mahanbot-complete-source.zip
          if-no-files-found: error
          retention-days: 30
